name: research-exploratory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/run_reference_ann_reliability.py"
      - "examples/provisional_exploratory_config.json"
      - "src/rc_single_span/research/**"
      - ".github/workflows/research-exploratory.yml"

jobs:
  exploratory-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Research mechanism tests
        run: python -m pytest -q tests/test_research_*.py
      - name: Run explicitly provisional study
        run: |
          python examples/run_reference_ann_reliability.py \
            examples/provisional_exploratory_config.json \
            --exploratory --output artifacts/research_exploratory \
            > research_run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-exploratory-${{ github.sha }}
          path: |
            artifacts/research_exploratory/
            research_run.log
          if-no-files-found: warn
