name: Ruff import diagnostic

on:
  push:
    branches: [main]

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.9
      - run: ruff check src/rc_single_span/research/evaluator.py --select I --diff || true
