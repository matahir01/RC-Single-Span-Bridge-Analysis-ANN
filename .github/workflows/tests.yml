name: tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install
        run: python -m pip install -e ".[dev,gui]"
      - name: Ruff
        run: ruff check src tests examples scripts
      - name: Pytest
        run: pytest -q
      - name: Same-runner pre-optimization LM1 comparison
        run: |
          git worktree add --detach "$RUNNER_TEMP/bridge-legacy" 88712208e00ec4c8b4d79d8d2e46769b5681d5f4
          python scripts/benchmark_lm1.py --root "$RUNNER_TEMP/bridge-legacy" --output "$RUNNER_TEMP/lm1-old.json" --step 3.0
          python scripts/benchmark_lm1.py --root . --output "$RUNNER_TEMP/lm1-new.json" --step 3.0
          python scripts/compare_lm1_results.py "$RUNNER_TEMP/lm1-old.json" "$RUNNER_TEMP/lm1-new.json"
      - name: Same-runner pre-optimization BS traffic comparison
        run: |
          python scripts/benchmark_bs_traffic.py --root "$RUNNER_TEMP/bridge-legacy" --output "$RUNNER_TEMP/bs-old.json"
          python scripts/benchmark_bs_traffic.py --root . --output "$RUNNER_TEMP/bs-new.json"
          python scripts/compare_bs_traffic.py "$RUNNER_TEMP/bs-old.json" "$RUNNER_TEMP/bs-new.json"
