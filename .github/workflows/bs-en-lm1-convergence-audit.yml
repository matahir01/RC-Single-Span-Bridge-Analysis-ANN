name: BS EN LM1 convergence audit

on:
  workflow_dispatch:
    inputs:
      initial_step_m:
        description: Initial longitudinal tandem step (m)
        required: true
        default: "1.2"
      minimum_step_m:
        description: Minimum longitudinal tandem step (m)
        required: true
        default: "0.6"
      relative_tolerance:
        description: Maximum accepted relative envelope change
        required: true
        default: "0.05"
  push:
    branches: [main]
    paths:
      - "src/rc_single_span/traffic/lm1.py"
      - "src/rc_single_span/traffic/lm1_influence.py"
      - "src/rc_single_span/traffic/lm1_influence_convergence.py"
      - "src/rc_single_span/codes/eurocode/lm1.py"
      - "examples/audit_bs_en_lm1_convergence.py"
      - ".github/workflows/bs-en-lm1-convergence-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run BS EN influence-surface convergence audit
        env:
          INITIAL_STEP_M: ${{ inputs.initial_step_m || '1.2' }}
          MINIMUM_STEP_M: ${{ inputs.minimum_step_m || '0.6' }}
          RELATIVE_TOLERANCE: ${{ inputs.relative_tolerance || '0.05' }}
        run: >-
          python examples/audit_bs_en_lm1_convergence.py
          --initial-step "$INITIAL_STEP_M"
          --minimum-step "$MINIMUM_STEP_M"
          --relative-tolerance "$RELATIVE_TOLERANCE"
          --max-refinements 1
          --max-exhaustive 5000
          --output bs_en_lm1_convergence_audit.json
      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bs-en-lm1-convergence-audit
          path: bs_en_lm1_convergence_audit.json
          if-no-files-found: error
          retention-days: 30
