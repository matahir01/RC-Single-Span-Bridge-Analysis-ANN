[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-single-span-bridge-analysis-ann"
version = "0.1.0"
description = "Engineering-focused single-span reinforced-concrete bridge analysis, design and reliability toolkit"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.8",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
